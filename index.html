<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <title>Trig Facts Challenge</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <!-- jQuery is required for MathQuill -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <!-- MathQuill CSS and JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.js"></script>

    <!-- Math.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
    <style>
        :root {
            --color-primary: #4f46e5;
            --color-primary-dark: #4338ca;
            --color-success: #10b981;
            --color-error: #e86565;
            --color-gray-100: #f3f4f6;
            --color-gray-300: #d1d5db;
            --color-gray-500: #6b7280;
            --color-gray-700: #374151;
            --color-gray-900: #1f2937;
            --shadow-card: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --transition-base: all 0.3s ease-in-out;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-gray-100);
        }

        .card {
            background-color: white;
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: var(--shadow-card);
            transition: var(--transition-base);
            width: 95%;
            max-width: 700px;
        }

        .btn {
            display: inline-block;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--color-primary-dark);
        }

        .btn-secondary {
            background-color: var(--color-success);
            color: white;
        }

        .btn-secondary:hover {
            background-color: #059669;
        }

        .btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .question-text {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 700;
            color: var(--color-gray-900);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.25rem;              /* Add gap between elements */
        }

        .feedback {
            min-height: 2.5rem;
            font-weight: 600;
            transition: var(--transition-base);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .feedback-correct { color: var(--color-success); }
        .feedback-incorrect { color: var(--color-error); }

        .level-section-title {
            text-align: left;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--color-gray-700);
            margin-top: 2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e5e7eb;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
        }

        .level-btn {
            border: 2px solid #e5e7eb;
            border-radius: 1rem;
            padding: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
        }

        .level-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .level-title {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            text-align: center;
            line-height: 1.2;
        }

        .best-time {
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 0.5rem;
        }

        /* Rating-based colors */
        .rating-none { background-color: #f3f4f6; color: #374151; }
        .rating-apprentice { background-color: #dcfce7; color: #166534; border-color: #86efac; }
        .rating-pro { background-color: #a7f3d0; color: #047857; border-color: #6ee7b7; }
        .rating-expert { background-color: #6ee7b7; color: #065f46; border-color: #34d399; }
        .rating-mastery { background: linear-gradient(145deg, #fde047, #facc15); color: #a16207; border-color: #f59e0b; }
        .rating-true-mastery { background: linear-gradient(145deg, #fce7f3, #f9a8d4); color: #9d174d; border-color: #f472b6; }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* MCQ Button Styles */
        .mcq-btn {
            background-color: white;
            border: 2px solid var(--color-gray-300);
            color: var(--color-gray-700);
            font-weight: 600;
            padding: 1rem;
            border-radius: 0.75rem;
            transition: all 0.2s ease-in-out;
            font-size: 1.1rem;
            position: relative;
        }

        .mcq-btn:hover:not(:disabled) {
            border-color: var(--color-primary);
            color: var(--color-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .mcq-btn.correct {
            background-color: var(--color-success);
            border-color: var(--color-success);
            color: white;
            animation: pulse 0.5s ease-in-out;
        }

        .mcq-btn.incorrect {
            background-color: var(--color-error);
            border-color: var(--color-error);
            color: white;
            opacity: 0.7;
        }

        .mcq-btn:disabled {
            cursor: not-allowed;
        }

        .mcq-btn .key-hint {
            position: absolute;
            top: 0.25rem;
            left: 0.5rem;
            font-size: 0.75rem;
            opacity: 0.5;
            font-weight: normal;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Quadrant diagram styling */
        #quadrant-diagram {
            touch-action: none;
            user-select: none;
        }

        .diagram-container {
            padding: 1rem;
            background: linear-gradient(145deg, #f9fafb, #f3f4f6);
            border-radius: 1rem;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }

        /* MathQuill Input Styles */
        .mathquill-input {
            display: inline-block;     /* Changed from inline-block */
            min-width: 100px;          /* Reduced from 200px */
            width: 100px;              /* Add fixed width */
            min-height: 80px;          /* Reduced from 80px */
            height: 80px;              /* Reduced height */
            border: 2px solid var(--color-primary);  /* Reduced from 3px */
            border-radius: 0.5rem;     /* Reduced from 0.75rem */
            padding: 0.5rem;           /* Reduced padding */
            font-size: 1.75rem;         /* Reduced from 1.5rem */
            background-color: white;
            margin: 0 0.25rem;         /* Reduced margin */
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
            vertical-align: middle;    /* Add this for proper alignment */
            text-align: center;
            white-space: nowrap;
        }

        .mathquill-input .mq-root-block {
            text-align: center !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            height: 100% !important;
        }
        .mathquill-input:focus-within {
            border-color: var(--color-primary-dark);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .mathquill-input.correct {
            border-color: var(--color-success);
            background-color: rgba(16, 185, 129, 0.05);
        }

        .mathquill-input.incorrect {
            border-color: var(--color-error);
            background-color: rgba(239, 68, 68, 0.05);
        }

    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <canvas id="confetti-canvas"></canvas>

    <div class="container mx-auto text-center">

        <div id="settings-screen" class="card mx-auto">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">Trig Facts Challenge</h1>

            <div id="level-selection-container"></div>
            <p class="text-xs text-gray-300 mt-6 text-center">Found a bug? Email jding@plc.nsw.edu.au</a></p>
        </div>

        <div id="game-screen" class="card mx-auto hidden">
            <div class="flex justify-between items-center mb-6 text-lg">
                <div class="font-semibold text-gray-700">

            </div>
            
            <!-- Quadrant Diagram Container -->
            <div id="diagram-container" class="diagram-container my-4 hidden">
                <canvas id="quadrant-diagram" width="300" height="300" 
                        class="mx-auto bg-white rounded-lg shadow-inner border border-gray-200"></canvas>

                <div id="mathquill-input" class="mathquill-input"></div>

    </div>

    <script>
        // Helper for creating DOM elements
        function createEl(tag, options = {}) {
            const el = document.createElement(tag);
            if (options.className) el.className = options.className;
            if (options.id) el.id = options.id;
            if (options.textContent) el.textContent = options.textContent;
            if (options.innerHTML) el.innerHTML = options.innerHTML;
            if (options.type) el.type = options.type;
            if (options.placeholder) el.placeholder = options.placeholder;
            if (options.step) el.step = options.step;
            if (options.style) Object.assign(el.style, options.style);
            if (options.autocomplete) el.autocomplete = options.autocomplete;
            if (options.disabled) el.disabled = options.disabled;
            return el;
        }

        // --- CONFIG ---
        const CONFIG = {
            LEVEL_GROUPS: {
                "Exact Values": [
                    { key: 'exact_deg_mixed', name: 'Degrees', type: 'exact', unit: 'deg' },
                    { key: 'exact_rad_mixed', name: 'Radians', type: 'exact', unit: 'rad' },
                ],
                "Unit Conversion": [
                    { key: 'simplify_fractions', name: 'Simplify Fractions<br>over 180', type: 'simplify_fractions' },
                    { key: 'deg_to_rad', name: 'Degrees to Radians', type: 'conversion', direction: 'd2r' },
                    { key: 'rad_to_deg', name: 'Radians to Degrees', type: 'conversion', direction: 'r2d' },
                    { key: 'conv_mixed', name: 'Mixed Conversion', type: 'conversion', direction: 'mixed' },
                ],
                "Quadrants & Equivalents": [
                    { key: 'reference_angles', name: 'Reference Angles', type: 'reference_angles' },
                    { key: 'quad_deg', name: 'Quadrants<br>[0, 360°]', type: 'quadrant', unit: 'deg' },
                    { key: 'quad_rad', name: 'Quadrants<br>[0, 2π]', type: 'quadrant', unit: 'rad' },
                    { key: 'equiv_deg', name: 'Equivalent Angles (°)', type: 'equivalent', unit: 'deg' },
                    { key: 'equiv_rad', name: 'Equivalent Angles (rad)', type: 'equivalent', unit: 'rad' },
                ],
            },
            REQUIRED_STREAK: 10,
            FEEDBACK_DELAY_CORRECT: 400,
            FEEDBACK_DELAY_INCORRECT: 1500,
            POSITIVE_FEEDBACK: ["Correct!", "Excellent!", "Nice one!", "Perfect!", "You know it!", "Awesome!", "Great!"],
            RATING_THRESHOLDS: [
                { maxAvg: 3, name: "💖 Unit Circle Queen 💖", key: "true-mastery" },
                { maxAvg: 4, name: "⚡️ Trig Master ⚡️", key: "mastery" },
                { maxAvg: 6, name: "Expert", key: "expert" },
                { maxAvg: 8, name: "Pro", key: "pro" },
                { maxAvg: Infinity, name: "Apprentice", key: "apprentice" }
            ],
            STORAGE_PREFIX: 'tf_bestTime_v5_',
            CONFETTI: { CORRECT: 40, SUCCESS: 150 }
        };

        // --- TrigQuestionGenerator Class ---
        class TrigQuestionGenerator {
            constructor() {
                this.initializeTrigData();
            }

            initializeTrigData() {
                this.TRIG_VALUES = [
                    { deg: '0°', rad: '0', sin: '0', cos: '1', tan: '0', val: { sin: 0, cos: 1, tan: 0 } },
                    { deg: '30°', rad: '\\frac{\\pi}{6}', sin: '\\frac{1}{2}', cos: '\\frac{\\sqrt{3}}{2}', 
                      tan: '\\frac{1}{\\sqrt{3}}', val: { sin: 0.5, cos: Math.sqrt(3)/2, tan: 1/Math.sqrt(3) } },
                    { deg: '45°', rad: '\\frac{\\pi}{4}', sin: '\\frac{1}{\\sqrt{2}}', cos: '\\frac{1}{\\sqrt{2}}', 
                      tan: '1', val: { sin: 1/Math.sqrt(2), cos: 1/Math.sqrt(2), tan: 1 } },
                    { deg: '60°', rad: '\\frac{\\pi}{3}', sin: '\\frac{\\sqrt{3}}{2}', cos: '\\frac{1}{2}', 
                      tan: '\\sqrt{3}', val: { sin: Math.sqrt(3)/2, cos: 0.5, tan: Math.sqrt(3) } },
                    { deg: '90°', rad: '\\frac{\\pi}{2}', sin: '1', cos: '0', tan: 'undefined', 
                      val: { sin: 1, cos: 0, tan: Infinity } },
                ];

                this.ALL_VALUES = this.TRIG_VALUES.flatMap(v => [v.sin, v.cos, v.tan])
                    .filter((v, i, a) => a.indexOf(v) === i && v !== 'undefined');

                this.CONVERSIONS = [
                    { deg: '120°', rad: '\\frac{2\\pi}{3}' }, { deg: '135°', rad: '\\frac{3\\pi}{4}' },
                    { deg: '150°', rad: '\\frac{5\\pi}{6}' }, { deg: '180°', rad: '\\pi' },
                    { deg: '210°', rad: '\\frac{7\\pi}{6}' }, { deg: '225°', rad: '\\frac{5\\pi}{4}' },
                    { deg: '240°', rad: '\\frac{4\\pi}{3}' }, { deg: '270°', rad: '\\frac{3\\pi}{2}' },
                    { deg: '300°', rad: '\\frac{5\\pi}{3}' }, { deg: '315°', rad: '\\frac{7\\pi}{4}' },
                    { deg: '330°', rad: '\\frac{11\\pi}{6}' }, { deg: '360°', rad: '2\\pi' }
                ];

                this.ALL_ANGLES = this.TRIG_VALUES.concat(this.CONVERSIONS);
                this.CAST_RULES = { sin: [1, 2], cos: [1, 4], tan: [1, 3] };
            }

            generate(level) {
                try {
                    switch(level.type) {
                        case 'exact': return this.generateExactValue(level);
                        case 'quadrant': return this.generateQuadrantValue(level);
                        case 'equivalent': return this.generateEquivalentRatio(level);
                        case 'conversion': return this.generateConversion(level);
                        case 'simplify_fractions': return this.generateSimplifyFractions(level);
                        case 'reference_angles': return this.generateReferenceAngles(level);
                        default: throw new Error(`Unknown level type: ${level.type}`);
                    }
                } catch (error) {
                    console.error('Error generating question:', error);
                    return { 
                        format: 'Error generating question', 
                        answer: 'error', 
                        options: ['error'], 
                        error: true 
                    };
                }
            }

            generateExactValue(level) {
                const func = this._getRandom(['sin', 'cos', 'tan']);
                const displayFunc = '\\' + func;
                const isDeg = level.unit === 'deg';
                
                let angle = this._getRandom(this.TRIG_VALUES);
                if (func === 'tan' && angle.tan === 'undefined') {
                    angle = this._getRandom(this.TRIG_VALUES.filter(v => v.tan !== 'undefined'));
                }

                const angleText = isDeg ? angle.deg : angle.rad;
                const value = angle[func];
                
                const questionType = Math.random() < 0.5 ? 'find_value' : 'find_angle';
                
                if (questionType === 'find_value') {
                    return { 
                        format: `${displayFunc}(${angleText}) = \\_\\_\\_`, 
                        answer: value, 
                        type: 'exact_value'
                    };
                } else {
                    return { 
                        format: `${displayFunc}(\\_\\_\\_) = ${value}`, 
                        answer: angleText, 
                        type: 'exact_angle'
                    };
                }
            }
        generateSimplifyFractions(level) {
            // Create fractions like 30/180, 60/180, 120/180, 240/180, etc.
            const numerators = [30, 45, 60, 90, 120, 135, 150, 180, 210, 225, 240, 270, 300, 315, 330, 360];
            const numerator = this._getRandom(numerators);
            
            // Calculate the simplified fraction
            const gcd = this._gcd(numerator, 180);
            const simplifiedNum = numerator / gcd;
            const simplifiedDen = 180 / gcd;
            
            let answer;
            if (simplifiedDen === 1) {
                answer = simplifiedNum.toString();
            } else {
                answer = `\\frac{${simplifiedNum}}{${simplifiedDen}}`;
            }
            
            // Generate distractors
            const distractors = new Set();
            
            // Add some common wrong answers
            const wrongAnswers = [
                `\\frac{${numerator}}{180}`, // Original unsimplified
                `\\frac{${numerator/2}}{90}`, // Half simplified
                `\\frac{${numerator/3}}{60}`, // Third simplified
                `\\frac{${Math.floor(numerator/10)}}{18}`, // Divided by 10
                (numerator/180).toFixed(2), // Decimal form
            ];
            
            wrongAnswers.forEach(wa => {
                if (wa !== answer) distractors.add(wa);
            });
            
            // Add more distractors if needed
            while (distractors.size < 5) {
                const randomNum = this._getRandom([1, 2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 18, 20]);
                const randomDen = this._getRandom([1, 2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 18, 20]);
                if (randomDen === 1) {
                    distractors.add(randomNum.toString());
                } else {
                    distractors.add(`\\frac{${randomNum}}{${randomDen}}`);
                }
            }
            
            // Convert to array and add the correct answer
            let options = Array.from(distractors).slice(0, 5);
            options.push(answer);
            
            // Shuffle the array to randomize positions
            options = options.sort(() => Math.random() - 0.5);
            
            return {
                format: `\\frac{${numerator}}{180} = \\_\\_\\_`,
                answer: answer,
                type: 'simplify_fractions'
            };
        }

        generateReferenceAngles(level) {
            // Common reference angles in degrees
            const referenceAngles = [30, 45, 60];
            const refAngle = this._getRandom(referenceAngles);
            
            // Generate angles of inclination that have this reference angle
            // Quadrant 1: angle itself
            // Quadrant 2: 180° - refAngle
            // Quadrant 3: 180° + refAngle  
            // Quadrant 4: 360° - refAngle
            const possibleAngles = [
                refAngle,                    // Q1
                180 - refAngle,             // Q2
                180 + refAngle,             // Q3
                360 - refAngle              // Q4
            ];
            
            const angleOfInclination = this._getRandom(possibleAngles);
            const answer = `${refAngle}°`;
            
            // Generate distractors - other common reference angles
            const allRefAngles = ['30°', '45°', '60°'];
            const distractors = new Set([answer]);
            
            // Add the other reference angles
            allRefAngles.forEach(angle => {
                if (angle !== answer) {
                    distractors.add(angle);
                }
            });
            
            // Add some common wrong answers (like using the angle itself, or 90° - angle)
            distractors.add(`${angleOfInclination}°`);
            distractors.add(`${90 - refAngle}°`);
            distractors.add(`${180 - refAngle}°`);
            
            // Convert to array and limit to 6 options
            let options = Array.from(distractors).slice(0, 6);
            
            // If we don't have enough options, add more
            while (options.length < 6) {
                const randomRef = this._getRandom([15, 20, 25, 35, 40, 50, 55, 65, 70, 75, 80, 85]);
                options.push(`${randomRef}°`);
                options = [...new Set(options)]; // Remove duplicates
            }
            
            // Shuffle the options
            options = options.sort(() => Math.random() - 0.5);
            
            return {
                format: `\\theta = ${angleOfInclination}°, A = \\_\\_\\_`,
                answer: answer,
                type: 'reference_angles'
            };
        }

            // Helper method for GCD calculation
            _gcd(a, b) {
                return b === 0 ? a : this._gcd(b, a % b);
            }

            generateQuadrantValue(level) {
                const refAngleObj = this._getRandom(
                    this.TRIG_VALUES.filter(a => parseInt(a.deg) > 0 && parseInt(a.deg) < 90)
                );
                const quadrant = this._getRandom([2, 3, 4]);
                const func = this._getRandom(['sin', 'cos', 'tan']);
                const displayFunc = '\\' + func;
                const isDeg = level.unit === 'deg';

                const refAngleDeg = parseInt(refAngleObj.deg);
                let angleDeg;
                
                if (quadrant === 2) angleDeg = 180 - refAngleDeg;
                else if (quadrant === 3) angleDeg = 180 + refAngleDeg;
                else angleDeg = 360 - refAngleDeg;

                const angleObj = this.ALL_ANGLES.find(a => parseInt(a.deg) === angleDeg);
                if (!angleObj) throw new Error(`Angle not found: ${angleDeg}°`);
                
                const angleText = isDeg ? angleObj.deg : angleObj.rad;
                const isPositive = this.CAST_RULES[func].includes(quadrant);
                const value = refAngleObj[func];
                const answer = isPositive ? value : `-${value}`;
                
                const allPossibleValues = this.ALL_VALUES.flatMap(v => {
                    if (v === '0') return [v];
                    return [v, `-${v}`];
                });

                const distractors = this._getDistractors(answer, allPossibleValues, 5);
                const options = this._sortOptions(distractors);

                return { 
                format: `${displayFunc}(${angleText}) = \\_\\_\\_`, 
                answer: answer, 
                angleDeg: angleDeg,
                quadrant: quadrant,
                type: 'quadrant'
            };
            }

            generateEquivalentRatio(level) {
                const isDeg = level.unit === 'deg';
                const func = this._getRandom(['sin', 'cos', 'tan']);
                const displayFunc = '\\' + func;

                const refAngles = this.TRIG_VALUES.filter(a => parseInt(a.deg) > 0 && parseInt(a.deg) < 90);
                const refAngleObj = this._getRandom(refAngles);
                const refAngleDeg = parseInt(refAngleObj.deg);
                const refAngleText = isDeg ? refAngleObj.deg : refAngleObj.rad;

                const quadrant = this._getRandom([2, 3, 4]);
                let angleDeg;
                
                if (quadrant === 2) angleDeg = 180 - refAngleDeg;
                else if (quadrant === 3) angleDeg = 180 + refAngleDeg;
                else angleDeg = 360 - refAngleDeg;
                
                const angleObj = this.ALL_ANGLES.find(a => parseInt(a.deg) === angleDeg);
                if (!angleObj) throw new Error(`Angle not found: ${angleDeg}°`);
                
                const angleText = isDeg ? angleObj.deg : angleObj.rad;
                const isPositive = this.CAST_RULES[func].includes(quadrant);
                const signChar = isPositive ? '' : '-';
                const answer = `${signChar}${displayFunc}(${refAngleText})`;

                const options = this._generateEquivalentOptions(
                    func, displayFunc, refAngleText, signChar, isDeg, refAngles
                );

                return { 
                format: `${displayFunc}(${angleText}) = \\_\\_\\_`, 
                answer: answer, 
                angleDeg: angleDeg,
                quadrant: quadrant,
                type: 'equivalent'
                };
            }

            generateConversion(level) {
                const angle = this._getRandom(this.ALL_ANGLES);
                const direction = (level.direction === 'mixed') 
                    ? this._getRandom(['d2r', 'r2d']) 
                    : level.direction;

                if (direction === 'd2r') {
                    return { 
                        format: `${angle.deg} = \\_\\_\\_ \\text{ rad}`, 
                        answer: angle.rad, 
                        type: 'conversion_d2r'
                    };
                } else {
                    return { 
                        format: `${angle.rad} = \\_\\_\\_^{\\circ}`, 
                        answer: angle.deg, 
                        type: 'conversion_r2d'
                    };
                }
            }

            _generateEquivalentOptions(func, displayFunc, refAngleText, signChar, isDeg, refAngles) {
                const options = new Set();
                options.add(`${signChar}${displayFunc}(${refAngleText})`);
                
                const oppositeSignChar = signChar === '' ? '-' : '';
                options.add(`${oppositeSignChar}${displayFunc}(${refAngleText})`);

                const otherRefAngle = this._getRandom(refAngles.filter(a => 
                    (isDeg ? a.deg : a.rad) !== refAngleText
                ));
                
                if (otherRefAngle) {
                    const otherRefAngleText = isDeg ? otherRefAngle.deg : otherRefAngle.rad;
                    options.add(`${signChar}${displayFunc}(${otherRefAngleText})`);
                    options.add(`${oppositeSignChar}${displayFunc}(${otherRefAngleText})`);
                }
                
                const otherFunc = this._getRandom(['sin', 'cos', 'tan'].filter(f => f !== func));
                const otherDisplayFunc = '\\' + otherFunc;
                options.add(`${signChar}${otherDisplayFunc}(${refAngleText})`);
                options.add(`${oppositeSignChar}${otherDisplayFunc}(${refAngleText})`);

                let finalOptions = Array.from(options);
                while (finalOptions.length < 6) {
                    const anotherRefAngle = this._getRandom(refAngles);
                    const anotherRefAngleText = isDeg ? anotherRefAngle.deg : anotherRefAngle.rad;
                    const randomSign = Math.random() < 0.5 ? '' : '-';
                    const randomFunc = this._getRandom(['sin', 'cos', 'tan']);
                    finalOptions.push(`${randomSign}\\${randomFunc}(${anotherRefAngleText})`);
                    finalOptions = [...new Set(finalOptions)];
                }

                return finalOptions.slice(0, 6).sort(() => Math.random() - 0.5);
            }

            _getRandom(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            }

            _getDistractors(correct, source, count = 5) {
                const distractors = new Set();
                distractors.add(correct);
                const filteredSource = source.filter(item => item !== correct);
                
                while (distractors.size < count + 1 && distractors.size < filteredSource.length + 1) {
                    distractors.add(this._getRandom(filteredSource));
                }
                
                return Array.from(distractors).sort(() => Math.random() - 0.5);
            }

            _evalMath(str) {
                if (!str || typeof str !== 'string') return -Infinity;
                if (str.includes('undefined')) return Infinity;
                
                try {
                    let s = str.replace(/\\/g, '');
                    s = s.replace(/sqrt\{(\d+)\}/g, 'Math.sqrt($1)');
                    s = s.replace(/frac\{(.+?)\}\{(.+?)\}/g, '($1)/($2)');
                    s = s.replace(/pi/g, 'Math.PI');
                    return eval(s);
                } catch (e) {
                    return -Infinity;
                }
            }

            _sortOptions(options) {
                return options.sort((a, b) => {
                    const valA = this._getNumericValue(a);
                    const valB = this._getNumericValue(b);
                    return valA - valB;
                });
            }

            _getNumericValue(str) {
                if (!str || typeof str !== 'string') return -Infinity;
                if (str.includes('undefined')) return Infinity;
                
                // Handle common exact values first
                const exactValues = {
                    '0': 0,
                    '\\frac{1}{2}': 0.5,
                    '\\frac{1}{\\sqrt{2}}': 1/Math.sqrt(2),
                    '\\frac{\\sqrt{2}}{2}': Math.sqrt(2)/2,
                    '\\frac{\\sqrt{3}}{2}': Math.sqrt(3)/2,
                    '1': 1,
                    '\\frac{1}{\\sqrt{3}}': 1/Math.sqrt(3),
                    '\\sqrt{3}': Math.sqrt(3),
                    '-\\frac{1}{2}': -0.5,
                    '-\\frac{1}{\\sqrt{2}}': -1/Math.sqrt(2),
                    '-\\frac{\\sqrt{2}}{2}': -Math.sqrt(2)/2,
                    '-\\frac{\\sqrt{3}}{2}': -Math.sqrt(3)/2,
                    '-1': -1,
                    '-\\frac{1}{\\sqrt{3}}': -1/Math.sqrt(3),
                    '-\\sqrt{3}': -Math.sqrt(3)
                };
                
                if (exactValues.hasOwnProperty(str)) {
                    return exactValues[str];
                }
                
                // Handle angle values
                const angleValues = {
                    '0°': 0, '30°': 30, '45°': 45, '60°': 60, '90°': 90,
                    '120°': 120, '135°': 135, '150°': 150, '180°': 180,
                    '210°': 210, '225°': 225, '240°': 240, '270°': 270,
                    '300°': 300, '315°': 315, '330°': 330, '360°': 360,
                    '0': 0,
                    '\\frac{\\pi}{6}': Math.PI/6,
                    '\\frac{\\pi}{4}': Math.PI/4,
                    '\\frac{\\pi}{3}': Math.PI/3,
                    '\\frac{\\pi}{2}': Math.PI/2,
                    '\\frac{2\\pi}{3}': 2*Math.PI/3,
                    '\\frac{3\\pi}{4}': 3*Math.PI/4,
                    '\\frac{5\\pi}{6}': 5*Math.PI/6,
                    '\\pi': Math.PI,
                    '\\frac{7\\pi}{6}': 7*Math.PI/6,
                    '\\frac{5\\pi}{4}': 5*Math.PI/4,
                    '\\frac{4\\pi}{3}': 4*Math.PI/3,
                    '\\frac{3\\pi}{2}': 3*Math.PI/2,
                    '\\frac{5\\pi}{3}': 5*Math.PI/3,
                    '\\frac{7\\pi}{4}': 7*Math.PI/4,
                    '\\frac{11\\pi}{6}': 11*Math.PI/6,
                    '2\\pi': 2*Math.PI
                };
                
                if (angleValues.hasOwnProperty(str)) {
                    return angleValues[str];
                }
                
                // Try to evaluate mathematically as fallback
                try {
                    let s = str.replace(/\\/g, '');
                    s = s.replace(/sqrt\{(\d+)\}/g, 'Math.sqrt($1)');
                    s = s.replace(/frac\{(.+?)\}\{(.+?)\}/g, '($1)/($2)');
                    s = s.replace(/pi/g, 'Math.PI');
                    return eval(s);
                } catch (e) {
                    return -Infinity;
                }
            }
        }

        // --- TrigUI Class ---
        class TrigUI {
            constructor() {
            this.elements = {
                settingsScreen: document.getElementById('settings-screen'),
                gameScreen: document.getElementById('game-screen'),
                successScreen: document.getElementById('success-screen'),
                levelSelection: document.getElementById('level-selection-container'),
                streakCounter: document.getElementById('streak-counter'),
                timer: document.getElementById('timer'),
                diagramContainer: document.getElementById('diagram-container'),
                diagramCanvas: document.getElementById('quadrant-diagram'),
                questionText: document.getElementById('question-text'),
                inputContainer: document.getElementById('input-container'),
                mathquillInput: document.getElementById('mathquill-input'),
                feedbackMessage: document.getElementById('feedback-message'),
                quitBtn: document.getElementById('quit-btn'),
                playAgainBtn: document.getElementById('play-again-btn'),
                completedLevel: document.getElementById('completed-level'),
                finalTime: document.getElementById('final-time'),
                finalRating: document.getElementById('final-rating'),
                bestTimeMessage: document.getElementById('best-time-message'),
                ratingExplanation: document.getElementById('rating-explanation'),
            };

            this.diagramRenderer = new QuadrantDiagramRenderer(this.elements.diagramCanvas);
            this.mathField = null;
           }

           showScreen(screenName) {
               ['settings', 'game', 'success'].forEach(s => {
                   this.elements[`${s}Screen`].classList.toggle('hidden', s !== screenName);
               });
           }

           renderLevelGrid(levelGroups, onSelect) {
               this.elements.levelSelection.innerHTML = '';
               
               for (const groupName in levelGroups) {
                   const title = createEl('h2', { 
                       className: 'level-section-title', 
                       textContent: groupName 
                   });
                   
                   const grid = createEl('div', { className: 'level-grid' });
                   
                   levelGroups[groupName].forEach(level => {
                       const bestTime = StorageManager.getBestTime(level.key);
                       const rating = bestTime ? StorageManager.getRating(bestTime) : null;
                       const ratingClass = rating ? `rating-${rating.key}` : 'rating-none';
                       
                       const btn = createEl('div', { 
                           className: `level-btn ${ratingClass}` 
                       });
                       btn.dataset.levelKey = level.key;
                       
                       const levelTitle = createEl('div', { 
                           className: 'level-title', 
                           innerHTML: level.name 
                       });
                       
                       const bestTimeText = createEl('div', { 
                           className: 'best-time', 
                           textContent: bestTime 
                               ? `Best: ${new Timer().formatTime(bestTime)}` 
                               : 'No time set'
                       });

                       btn.append(levelTitle, bestTimeText);
                       btn.addEventListener('click', () => {
                           const selectedLevel = Object.values(levelGroups)
                               .flat()
                               .find(l => l.key === btn.dataset.levelKey);
                           onSelect(selectedLevel);
                       });
                       
                       grid.append(btn);
                   });
                   
                   this.elements.levelSelection.append(title, grid);
               }
           }

            displayQuestion(question, levelType) {
                this.elements.questionText.innerHTML = '';
                
                // Show/hide diagram based on question type
                if ((levelType === 'quadrant' || levelType === 'equivalent') && question.angleDeg) {
                    this.elements.diagramContainer.classList.remove('hidden');
                    this.diagramRenderer.draw(question.angleDeg, question.quadrant);
                } else {
                    this.elements.diagramContainer.classList.add('hidden');
                }
                
                // Adjust input width based on question type
                this.adjustInputWidth(question.type);  // ADD THIS LINE
                
                // Split the question at the blank and create inline elements
                const parts = question.format.split('\\_\\_\\_');
                
                if (parts.length === 2) {
                    // Create first part
                    const firstPart = document.createElement('span');
                    try {
                        katex.render(parts[0], firstPart, {
                            throwOnError: false,
                            displayMode: false
                        });
                    } catch (error) {
                        firstPart.textContent = parts[0];
                    }
                    
                    // Create input container
                    const inputWrapper = document.createElement('span');
                    inputWrapper.appendChild(this.elements.mathquillInput);
                    
                    // Create second part
                    const secondPart = document.createElement('span');
                    try {
                        katex.render(parts[1], secondPart, {
                            throwOnError: false,
                            displayMode: false
                        });
                    } catch (error) {
                        secondPart.textContent = parts[1];
                    }
                    
                    // Append all parts to question text
                    this.elements.questionText.appendChild(firstPart);
                    this.elements.questionText.appendChild(inputWrapper);
                    this.elements.questionText.appendChild(secondPart);
                } else {
                    // Fallback for questions without blanks
                    try {
                        katex.render(question.format, this.elements.questionText, {
                            throwOnError: false,
                            displayMode: false
                        });
                    } catch (error) {
                        this.elements.questionText.textContent = question.format;
                    }
                }
                
                // Initialize MathQuill input
                this.initializeMathQuill();
                
                // Enable input for new question
                this.enableInput();
            }

            initializeMathQuill() {
                // Clear previous MathQuill instance
                if (this.mathField) {
                    this.mathField.revert();
                }
                
                // Initialize new MathQuill instance
                const MQ = MathQuill.getInterface(2);
                this.mathField = MQ.MathField(this.elements.mathquillInput, {
                    spaceBehavesLikeTab: true,
                    leftRightIntoCmdGoes: 'up',
                    restrictMismatchedBrackets: true,
                    sumStartsWithNEquals: true,
                    supSubsRequireOperand: true,
                    charsThatBreakOutOfSupSub: '+-=<>',
                    autoSubscriptNumerals: true,
                    autoCommands: 'pi theta alpha beta gamma delta epsilon zeta eta mu nu xi rho sigma tau phi chi psi omega sqrt sum prod int frac',
                    autoOperatorNames: 'sin cos tan cot sec csc sinh cosh tanh coth sech csch arcsin arccos arctan arccot arcsec arccsc',
                });
                
                // Reset input styling
                this.elements.mathquillInput.classList.remove('correct', 'incorrect');
                
                // Focus the input
                this.mathField.focus();
            }

            addAutoParentheses(latex) {
                
                // Pattern to match trig functions followed by numbers/expressions without parentheses
                const trigFunctions = ['sin', 'cos', 'tan', 'cot', 'sec', 'csc'];
                
                let result = latex;
                
                for (const func of trigFunctions) {
                    // Match patterns like \sin30, \cos60, -\tan45, etc.
                    const pattern = new RegExp(`(\\\\${func})([0-9]+(?:\\.[0-9]+)?|\\\\pi|\\\\frac\\{[^}]+\\}\\{[^}]+\\})(?!\\()`, 'g');
                    result = result.replace(pattern, `$1\\left($2\\right)`);
                    
                    // Also handle cases without backslash (in case MathQuill processes it)
                    const simplePattern = new RegExp(`(${func})([0-9]+(?:\\.[0-9]+)?|pi|frac\\{[^}]+\\}\\{[^}]+\\})(?!\\()`, 'g');
                    result = result.replace(simplePattern, `$1($2)`);
                }
                
                return result;
            }

            adjustInputWidth(questionType) {
                const inputElement = this.elements.mathquillInput;
                
                if (questionType === 'equivalent') {
                    // Make wider for equivalent expressions
                    inputElement.style.minWidth = '200px';
                    inputElement.style.width = '200px';
                } else {
                    // Default width for other question types
                    inputElement.style.minWidth = '120px';
                    inputElement.style.width = '120px';
                }
            }

            getUserAnswer() {
                if (!this.mathField) return '';
                const rawLatex = this.mathField.latex().trim();
                return this.addAutoParentheses(rawLatex);
            }

            clearInput() {
                if (this.mathField) {
                    this.mathField.latex('');
                    this.mathField.focus();
                }
                this.elements.mathquillInput.classList.remove('correct', 'incorrect');
            }

            highlightInput(isCorrect) {
                this.elements.mathquillInput.classList.remove('correct', 'incorrect');
                this.elements.mathquillInput.classList.add(isCorrect ? 'correct' : 'incorrect');
            }

            disableInput() {
                if (this.mathField) {
                    this.mathField.config({ disabled: true });
                }
            }

            enableInput() {
                if (this.mathField) {
                    this.mathField.config({ disabled: false });
                }
            }

           updateStreak(streak) {
               this.elements.streakCounter.textContent = streak;
               
               // Add animation for streak milestones
               if (streak > 0 && streak % 5 === 0) {
                   this.elements.streakCounter.parentElement.style.animation = 'pulse 0.5s ease-in-out';
                   setTimeout(() => {
                       this.elements.streakCounter.parentElement.style.animation = '';
                   }, 500);
               }
           }

           showFeedback(isCorrect, message, useKatex = false) {
               this.elements.feedbackMessage.innerHTML = '';
               this.elements.feedbackMessage.className = `feedback ${isCorrect ? 'feedback-correct' : 'feedback-incorrect'}`;
               
               if (useKatex) {
                   try {
                       katex.render(message, this.elements.feedbackMessage, { 
                           throwOnError: false 
                       });
                   } catch (e) {
                       this.elements.feedbackMessage.textContent = message;
                   }
               } else {
                   this.elements.feedbackMessage.textContent = message;
               }
           }

           clearFeedback() {
               this.elements.feedbackMessage.innerHTML = '';
               this.elements.feedbackMessage.className = 'feedback';
           }

           showSuccess(levelName, time, rating, isNewBest, previousBest) {
               this.elements.completedLevel.textContent = levelName;
               this.elements.finalTime.textContent = new Timer().formatTime(time);
               this.elements.finalRating.textContent = rating.name;
               this.elements.ratingExplanation.textContent = 
                   `(Avg time per question: < ${rating.maxAvg}s)`;
               
               if (isNewBest) {
                   this.elements.bestTimeMessage.textContent = previousBest 
                       ? `New personal best! Beat your old time of ${new Timer().formatTime(previousBest)}.`
                       : `You've set your first record!`;
               } else {
                   this.elements.bestTimeMessage.textContent = 
                       `Your best time is still ${new Timer().formatTime(previousBest)}.`;
               }
               
               this.showScreen('success');
           }
       }

       // --- QuadrantDiagramRenderer Class ---
       class QuadrantDiagramRenderer {
           constructor(canvas) {
               this.canvas = canvas;
               this.ctx = canvas.getContext('2d');
               this.size = 300;
               this.center = this.size / 2;
               this.radius = this.size * 0.38;
               this.setupHighDPI();
           }

           setupHighDPI() {
               const dpr = window.devicePixelRatio || 1;
               this.canvas.width = this.size * dpr;
               this.canvas.height = this.size * dpr;
               this.canvas.style.width = `${this.size}px`;
               this.canvas.style.height = `${this.size}px`;
               this.ctx.scale(dpr, dpr);
           }

           draw(angleDeg, quadrant = null) {
               this.clear();
               this.drawAxes();
               this.drawUnitCircle();
               this.drawQuadrantLabels();
               
               if (angleDeg !== undefined) {
                   this.drawAngle(angleDeg);
                   if (quadrant) {
                       this.highlightQuadrant(quadrant);
                   }
               }
           }

           clear() {
               this.ctx.clearRect(0, 0, this.size, this.size);
           }

           drawAxes() {
               const arrowSize = 6;
               
               this.ctx.strokeStyle = '#d1d5db';
               this.ctx.lineWidth = 1.5;
               this.ctx.beginPath();
               
               // X-axis with arrow
               this.ctx.moveTo(10, this.center);
               this.ctx.lineTo(this.size - 10, this.center);
               this.ctx.moveTo(this.size - 10 - arrowSize, this.center - arrowSize);
               this.ctx.lineTo(this.size - 10, this.center);
               this.ctx.lineTo(this.size - 10 - arrowSize, this.center + arrowSize);
               
               // Y-axis with arrow
               this.ctx.moveTo(this.center, this.size - 10);
               this.ctx.lineTo(this.center, 10);
               this.ctx.moveTo(this.center - arrowSize, 10 + arrowSize);
               this.ctx.lineTo(this.center, 10);
               this.ctx.lineTo(this.center + arrowSize, 10 + arrowSize);
               
               this.ctx.stroke();
           }

           drawUnitCircle() {
               this.ctx.strokeStyle = '#9ca3af';
               this.ctx.lineWidth = 1.5;
               this.ctx.beginPath();
               this.ctx.arc(this.center, this.center, this.radius, 0, 2 * Math.PI);
               this.ctx.stroke();
           }

           drawQuadrantLabels() {
               this.ctx.fillStyle = '#6b7280';
               this.ctx.font = '16px Inter, sans-serif';
               this.ctx.textAlign = 'center';
               this.ctx.textBaseline = 'middle';
               
               const offset = this.center * 0.5;
               
               // ASTC labels
               this.ctx.fillText('A', this.center + offset, this.center - offset);
               this.ctx.fillText('S', this.center - offset, this.center - offset);
               this.ctx.fillText('T', this.center - offset, this.center + offset);
               this.ctx.fillText('C', this.center + offset, this.center + offset);
           }

           drawAngle(angleDeg) {
               const angleRad = angleDeg * Math.PI / 180;
               
               // Draw angle arc
               this.ctx.fillStyle = 'rgba(79, 70, 229, 0.1)';
               this.ctx.strokeStyle = '#4f46e5';
               this.ctx.lineWidth = 2;
               this.ctx.beginPath();
               this.ctx.moveTo(this.center, this.center);
               this.ctx.arc(this.center, this.center, this.radius * 0.4, 0, -angleRad, true);
               this.ctx.closePath();
               this.ctx.fill();
               this.ctx.stroke();
               
               // Draw terminal arm
               const endX = this.center + this.radius * Math.cos(angleRad);
               const endY = this.center - this.radius * Math.sin(angleRad);
               
               this.ctx.strokeStyle = '#ef4444';
               this.ctx.lineWidth = 2.5;
               this.ctx.beginPath();
               this.ctx.moveTo(this.center, this.center);
               this.ctx.lineTo(endX, endY);
               this.ctx.stroke();
               
               // Draw point at end of terminal arm
               this.ctx.fillStyle = '#ef4444';
               this.ctx.beginPath();
               this.ctx.arc(endX, endY, 4, 0, 2 * Math.PI);
               this.ctx.fill();
           }

           highlightQuadrant(quadrant) {
               this.ctx.fillStyle = 'rgba(251, 191, 36, 0.1)';
               this.ctx.beginPath();
               
               const startAngle = [0, -Math.PI/2, -Math.PI, -3*Math.PI/2][quadrant - 1];
               const endAngle = startAngle - Math.PI/2;
               
               this.ctx.moveTo(this.center, this.center);
               this.ctx.arc(this.center, this.center, this.radius, startAngle, endAngle, true);
               this.ctx.closePath();
               this.ctx.fill();
           }
       }

        // --- AnswerChecker Class ---
        class AnswerChecker {
            constructor() {
                this.tolerance = 1e-10;
            }
            
            checkAnswer(userLatex, correctAnswer, questionType) {
                try {                   
                    // Handle special cases first
                    if (this.handleSpecialCases(userLatex, correctAnswer)) {
                        return true;
                    }
                    
                    // Convert both answers to comparable forms
                    const userValue = this.latexToValue(userLatex);
                    const correctValue = this.latexToValue(correctAnswer);
                    
                    // For exact comparisons (like fractions, radians)
                    if (questionType === 'exact_value' || questionType === 'exact_angle' || 
                        questionType === 'conversion_d2r' || questionType === 'conversion_r2d' ||
                        questionType === 'equivalent' || questionType === 'quadrant') {
                        const result = this.compareExact(userValue, correctValue, userLatex, correctAnswer);
                        return result;
                    }
                    
                    // For approximate comparisons
                    if (typeof userValue === 'number' && typeof correctValue === 'number') {
                        const diff = Math.abs(userValue - correctValue);
                        const result = diff < this.tolerance;
                        return result;
                    }
                    
                    return false;
                    
                } catch (error) {
                    return false;
                }
            }
            
            handleSpecialCases(userLatex, correctAnswer) {
                // Handle undefined/infinity cases
                if (correctAnswer === 'undefined') {
                    return userLatex.includes('undefined') || userLatex.includes('\\text{undefined}');
                }
                
                // Handle exact string matches
                if (userLatex === correctAnswer) {
                    return true;
                }
                
                return false;
            }
            
            normalizeEquivalentExpression(expr) {
                // Remove backslashes and normalize function expressions
                let normalized = expr
                    .replace(/\\/g, '')
                    .replace(/\{([^}]+)\}/g, '($1)')  // Convert {30} to (30)
                    .replace(/\s+/g, '')
                    .toLowerCase();
                
                // Sort the components for consistent comparison
                // Handle expressions like "sin(30)" or "-cos(45)"
                const match = normalized.match(/^(-?)(sin|cos|tan|cot|sec|csc)\(([^)]+)\)$/);
                if (match) {
                    const [, sign, func, angle] = match;
                    return `${sign}${func}(${angle})`;
                }
                
                return normalized;
            }

            latexToValue(latex) {
                
                try {
                    // Handle common LaTeX expressions
                    let expr = latex
                        .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '($1)/($2)')
                        .replace(/\\sqrt\{([^}]+)\}/g, 'sqrt($1)')
                        .replace(/\\pi/g, 'pi')
                        .replace(/\\theta/g, 'theta')
                        .replace(/\\circ/g, '')
                        .replace(/°/g, '')
                        .replace(/\\text\{([^}]+)\}/g, '$1')
                        .replace(/\\left\(/g, '(')
                        .replace(/\\right\)/g, ')')
                        .replace(/\\sin/g, 'sin')
                        .replace(/\\cos/g, 'cos')
                        .replace(/\\tan/g, 'tan')
                        .replace(/\\cot/g, 'cot')
                        .replace(/\\sec/g, 'sec')
                        .replace(/\\csc/g, 'csc')
                        .replace(/\s+/g, '');
                    
                    
                    // For equivalent expressions, return the normalized string instead of evaluating
                    if (expr.includes('sin') || expr.includes('cos') || expr.includes('tan')) {
                        const normalized = this.normalizeEquivalentExpression(expr);
                        return normalized;
                    }
                    
                    // Try to evaluate with math.js
                    const scope = { pi: Math.PI, e: Math.E };
                    const result = math.evaluate(expr, scope);
                    return result;
                    
                } catch (error) {
                    // If evaluation fails, return the normalized string for comparison
                    const normalized = this.normalizeEquivalentExpression(latex);
                    return normalized;
                }
            }
            
            compareExact(userValue, correctValue, userLatex, correctLatex) {
                
                // For equivalent expressions, compare the normalized forms
                if (typeof userValue === 'string' && typeof correctValue === 'string') {
                    const isEqual = userValue === correctValue;
                    
                    if (isEqual) {
                        return true;
                    }
                    
                    // Try trimmed comparison as fallback
                    const trimmedEqual = userValue.trim() === correctValue.trim();
                    if (trimmedEqual) {
                        return true;
                    }
                }
                
                // Try numeric comparison
                if (typeof userValue === 'number' && typeof correctValue === 'number') {
                    const diff = Math.abs(userValue - correctValue);
                    const result = diff < this.tolerance;
                    if (result) {
                        return true;
                    }
                }
                
                // Then try normalized LaTeX comparison
                const normalizedUser = this.normalizeLaTeX(userLatex);
                const normalizedCorrect = this.normalizeLaTeX(correctLatex);
                
                if (normalizedUser === normalizedCorrect) {
                    return true;
                }
                
                // Try equivalent forms
                const equivalentResult = this.checkEquivalentForms(normalizedUser, normalizedCorrect);
                return equivalentResult;
            }
            
            normalizeLaTeX(latex) {
                return latex
                    .replace(/\s+/g, '')
                    .replace(/\\frac\{1\}\{\\sqrt\{2\}\}/g, '\\frac{\\sqrt{2}}{2}')
                    .replace(/\\frac\{\\sqrt\{2\}\}\{2\}/g, '\\frac{1}{\\sqrt{2}}')
                    .replace(/\{1\}/g, '1')
                    .replace(/\{2\}/g, '2')
                    .replace(/\{3\}/g, '3');
            }
            
            checkEquivalentForms(user, correct) {
                // Define equivalent expressions
                const equivalents = [
                    ['\\frac{1}{\\sqrt{2}}', '\\frac{\\sqrt{2}}{2}'],
                    ['\\frac{1}{\\sqrt{3}}', '\\frac{\\sqrt{3}}{3}'],
                    ['-\\frac{1}{2}', '-0.5'],
                    ['\\frac{1}{2}', '0.5'],
                    ['0', '0.0'],
                    ['1', '1.0'],
                ];
                
                for (const [form1, form2] of equivalents) {
                    if ((user === form1 && correct === form2) || (user === form2 && correct === form1)) {
                        return true;
                    }
                }
                
                return false;
            }
        }

       // --- GameState Class ---
       class GameState {
           constructor() {
               this.reset();
           }

           reset() {
               this.currentLevel = null;
               this.currentQuestion = null;
               this.currentAnswer = null;
               this.correctStreak = 0;
               this.totalQuestions = 0;
               this.isAnswering = false;
           }

           setLevel(level) {
               this.reset();
               this.currentLevel = level;
           }

           setQuestion(question) {
                this.currentQuestion = question;
                this.currentAnswer = question.answer;
            }

           incrementStreak() {
               this.correctStreak++;
               this.totalQuestions++;
               return this.correctStreak;
           }

           resetStreak() {
               this.correctStreak = 0;
           }

           isComplete() {
               return this.correctStreak >= CONFIG.REQUIRED_STREAK;
           }

           setAnswering(value) {
               this.isAnswering = value;
           }
       }

       // --- Timer Class ---
       class Timer {
           constructor(displayElement) {
               this.display = displayElement;
               this.reset();
           }

           reset() {
               this.startTime = 0;
               this.interval = null;
               this.seconds = 0;
           }

           start() {
               this.reset();
               this.startTime = Date.now();
               if (this.display) {
                   this.display.textContent = this.formatTime(0);
               }
               
               this.interval = setInterval(() => {
                   this.seconds = Math.floor((Date.now() - this.startTime) / 1000);
                   if (this.display) {
                       this.display.textContent = this.formatTime(this.seconds);
                   }
               }, 100);
           }

           stop() {
               if (this.interval) {
                   clearInterval(this.interval);
                   this.interval = null;
               }
           }

           pause() {
               this.stop();
           }

           resume() {
               if (!this.interval && this.startTime) {
                   const pausedSeconds = this.seconds;
                   this.startTime = Date.now() - (pausedSeconds * 1000);
                   
                   this.interval = setInterval(() => {
                       this.seconds = Math.floor((Date.now() - this.startTime) / 1000);
                       if (this.display) {
                           this.display.textContent = this.formatTime(this.seconds);
                       }
                   }, 100);
               }
           }

           getSeconds() {
               return this.seconds;
           }

           formatTime(sec) {
               const minutes = Math.floor(sec / 60).toString().padStart(2, '0');
               const seconds = (sec % 60).toString().padStart(2, '0');
               return `${minutes}:${seconds}`;
           }
       }

       // --- StorageManager Class ---
       class StorageManager {
           static saveBestTime(levelKey, time) {
               try {
                   localStorage.setItem(`${CONFIG.STORAGE_PREFIX}${levelKey}`, time);
               } catch (error) {
                   console.error('Error saving best time:', error);
               }
           }

           static getBestTime(levelKey) {
               try {
                   const time = localStorage.getItem(`${CONFIG.STORAGE_PREFIX}${levelKey}`);
                   return time ? parseInt(time, 10) : null;
               } catch (error) {
                   console.error('Error retrieving best time:', error);
                   return null;
               }
           }

           static getRating(time) {
               const avgTime = time / CONFIG.REQUIRED_STREAK;
               return CONFIG.RATING_THRESHOLDS.find(r => avgTime <= r.maxAvg);
           }

           static clearAllData() {
               try {
                   const keys = Object.keys(localStorage);
                   keys.forEach(key => {
                       if (key.startsWith(CONFIG.STORAGE_PREFIX)) {
                           localStorage.removeItem(key);
                       }
                   });
               } catch (error) {
                   console.error('Error clearing data:', error);
               }
           }
       }

       // --- ConfettiManager Class ---
       class Confetti {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.pieces = [];
                this.animationFrame = null;
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            }
            
            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            
            trigger(count) {
                for (let i = 0; i < count; i++) {
                    this.pieces.push(this.createPiece());
                }
                if (!this.animationFrame) {
                    this.animate();
                }
            }
            
            createPiece() {
                const x = this.canvas.width * Math.random();
                const y = -20;
                const size = Math.random() * 10 + 5;
                const colors = ['#fde047', '#facc15', '#a3e635', '#4ade80', '#34d399', '#2dd4bf', '#67e8f9', '#7dd3fc', '#93c5fd', '#a5b4fc', '#c4b5fd', '#d8b4fe', '#f0abfc', '#f9a8d4'];
                return {
                    x, y, size,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: Math.random() * 10 - 5,
                    vy: Math.random() * 5 + 2,
                    angle: Math.random() * Math.PI * 2,
                    spin: Math.random() * 0.2 - 0.1
                };
            }
            
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.pieces.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.angle += p.spin;
                    this.ctx.save();
                    this.ctx.translate(p.x, p.y);
                    this.ctx.rotate(p.angle);
                    this.ctx.fillStyle = p.color;
                    this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    this.ctx.restore();
                    if (p.y > this.canvas.height) {
                        this.pieces.splice(index, 1);
                    }
                });
                if (this.pieces.length > 0) {
                    this.animationFrame = requestAnimationFrame(() => this.animate());
                } else {
                    this.animationFrame = null;
                }
            }
        }

       // --- TrigGameController Class ---
       class TrigGameController {
           constructor() {
                this.state = new GameState();
                this.ui = new TrigUI();
                this.timer = new Timer(this.ui.elements.timer);
                this.questionGen = new TrigQuestionGenerator();
                this.confetti = new Confetti('confetti-canvas');
                this.answerChecker = new AnswerChecker();
                
                this.setupEventListeners();
                this.initialize();
            }

           initialize() {
               this.ui.renderLevelGrid(CONFIG.LEVEL_GROUPS, (level) => this.startGame(level));
               this.ui.showScreen('settings');
           }

           setupEventListeners() {
                // Button listeners
                this.ui.elements.quitBtn.addEventListener('click', () => this.quitGame());
                this.ui.elements.playAgainBtn.addEventListener('click', () => this.quitGame());
                
                // Keyboard listeners
                document.addEventListener('keydown', (e) => this.handleKeypress(e));
            }

           handleKeypress(e) {
                // Only handle keypresses during game
                if (this.ui.elements.gameScreen.classList.contains('hidden')) {
                    return;
                }

                // Escape key to quit
                if (e.key === 'Escape') {
                    this.quitGame();
                    return;
                }

                // Enter key to submit answer
                if (e.key === 'Enter' && !this.state.isAnswering) {
                    e.preventDefault();
                    this.checkAnswer();
                }
            }

           startGame(level) {
               this.state.setLevel(level);
               this.ui.showScreen('game');
               this.ui.updateStreak(0);
               this.timer.start();
               this.generateQuestion();
           }

           generateQuestion() {
                this.ui.clearFeedback();
                this.state.setAnswering(false);
                
                try {
                    const question = this.questionGen.generate(this.state.currentLevel);
                    
                    if (question.error) {
                        console.error('Question generation failed');
                        this.ui.showFeedback(false, 'Error generating question');
                        setTimeout(() => this.generateQuestion(), 1000);
                        return;
                    }
                                        
                    this.state.setQuestion(question);
                    
                    this.ui.displayQuestion(
                        question, 
                        this.state.currentLevel.type
                    );
                    
                } catch (error) {
                    console.error('Error in generateQuestion:', error, error.stack);
                    this.ui.showFeedback(false, 'Error generating question');
                    setTimeout(() => this.generateQuestion(), 1000);
                }
            }

           checkAnswer() {
                if (this.state.isAnswering) return;
                
                const userAnswer = this.ui.getUserAnswer();
                if (!userAnswer || userAnswer.trim() === '') {
                    this.ui.showFeedback(false, 'Please enter an answer');
                    return;
                }
                
                this.state.setAnswering(true);
                this.ui.disableInput();
                
                const isCorrect = this.answerChecker.checkAnswer(
                    userAnswer, 
                    this.state.currentAnswer, 
                    this.state.currentQuestion.type
                );
                
                if (isCorrect) {
                    this.handleCorrectAnswer();
                } else {
                    this.handleIncorrectAnswer();
                }
            }

            handleCorrectAnswer() {
                const newStreak = this.state.incrementStreak();
                this.ui.updateStreak(newStreak);
                
                this.ui.highlightInput(true);
                
                const feedback = CONFIG.POSITIVE_FEEDBACK[
                    Math.floor(Math.random() * CONFIG.POSITIVE_FEEDBACK.length)
                ];
                this.ui.showFeedback(true, feedback);
                
                this.confetti.trigger(CONFIG.CONFETTI.CORRECT);
                
                if (this.state.isComplete()) {
                    setTimeout(() => this.showSuccess(), CONFIG.FEEDBACK_DELAY_CORRECT);
                } else {
                    setTimeout(() => this.generateQuestion(), CONFIG.FEEDBACK_DELAY_CORRECT);
                }
            }

            handleIncorrectAnswer() {
                this.state.resetStreak();
                this.ui.updateStreak(0);
                
                this.ui.highlightInput(false);
                this.ui.showFeedback(false, this.state.currentAnswer, true);
                
                // Reset timer on incorrect answer
                this.timer.reset();
                this.timer.start();
                
                setTimeout(() => this.generateQuestion(), CONFIG.FEEDBACK_DELAY_INCORRECT);
            }

           showSuccess() {
               this.timer.stop();
               const time = this.timer.getSeconds();
               const previousBest = StorageManager.getBestTime(this.state.currentLevel.key);
               const isNewBest = !previousBest || time < previousBest;
               
               if (isNewBest) {
                   StorageManager.saveBestTime(this.state.currentLevel.key, time);
                   this.confetti.trigger(CONFIG.CONFETTI.SUCCESS);
               }
               
               const rating = StorageManager.getRating(time);
               
               this.ui.showSuccess(
                   this.state.currentLevel.name, 
                   time, 
                   rating, 
                   isNewBest, 
                   previousBest
               );
           }

           quitGame() {
               this.timer.stop();
               this.state.reset();
               this.initialize();
           }
       }

       // --- Initialize the Game ---
       document.addEventListener('DOMContentLoaded', () => {
           new TrigGameController();
       });
   </script>
