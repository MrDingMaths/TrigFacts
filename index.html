<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <title>Trig Mastery Challenge</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <!-- Local MathQuill CSS -->
    <link rel="stylesheet" href="lib/mathquill/mathquill.css">

    <!-- Custom TrigFacts Styling -->
    <link rel="stylesheet" href="trig-style/trig-style.css">

    <!-- Navigation buttons styles -->
    <link rel="stylesheet" href="navigationButtons.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-gray-100);
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <canvas id="confetti-canvas"></canvas>

    <div class="container mx-auto text-center">

        <!-- Settings Screen -->
        <div id="settings-screen" class="card mx-auto">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">Trig Mastery Challenge</h1>
            <p class="text-gray-600 mb-8">Answer 10 in a row quickly to achieve mastery</p>
            <div id="level-selection-container"></div>
            <p class="text-xs text-gray-300 mt-6 text-center">Found a bug? Email jding@plc.nsw.edu.au</p>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="card mx-auto hidden">
            <div class="flex justify-between items-center mb-6 text-lg">
                <div class="font-semibold text-gray-700">
                    Streak: <span id="streak-counter" class="font-bold text-blue-600 text-xl">0</span>🔥
                </div>
                <div class="font-semibold text-gray-700">
                    Time: <span id="timer" class="font-bold text-blue-600 text-xl">00:00</span>
                </div>
            </div>

            <!-- Level Name Display -->
            <div id="level-name" class="text-center text-gray-700 text-xl mb-4"></div>

            <!-- Timer Paused Message -->
            <div id="timer-paused-message" class="hidden font-semibold text-orange-600">
                Timer reset & paused
            </div>

            <!-- Quadrant Diagram Container -->
            <div id="diagram-container" class="diagram-container my-4 hidden">
                <canvas id="quadrant-diagram" width="300" height="300"
                        class="mx-auto bg-white rounded-lg shadow-inner border border-gray-200"></canvas>
            </div>

            <!-- Question Display -->
            <div id="question-container" class="my-8 min-h-[60px] flex items-center justify-center">
                <div id="question-text" class="question-text"></div>
            </div>

            <!-- Input Container -->
            <div id="input-container" class="flex flex-col items-center my-6">
                <div id="mathquill-input" class="mathquill-input"></div>
            </div>

            <!-- Feedback Message -->
            <div id="feedback-message" class="feedback my-4"></div>

            <!-- Quit Button -->
            <button id="quit-btn" class="mt-6 text-gray-500 hover:text-gray-700 font-semibold">
                Back to Levels
            </button>
        </div>

        <!-- Success Screen -->
        <div id="success-screen" class="card mx-auto hidden">
            <h2 class="text-3xl md:text-4xl font-bold text-green-500 mb-4">🎉 Challenge Complete! 🎉</h2>
            <p class="text-gray-700 text-xl mb-2">
                You got 10 in a row for <span id="completed-level" class="font-bold"></span>!
            </p>
            <p class="text-gray-700 text-xl mb-4">
                Your time: <span id="final-time" class="font-bold text-blue-600"></span>
            </p>
            <div id="rating-info" class="bg-blue-100 text-blue-800 rounded-xl p-4 mb-6">
                <p class="text-lg font-semibold">Rating: <span id="final-rating" class="font-bold"></span></p>
                <p id="best-time-message" class="mt-1 font-medium"></p>
                <p id="rating-explanation" class="text-sm mt-2 text-blue-700"></p>
            </div>
            <button id="replay-level-btn" class="btn btn-primary w-full max-w-xs mx-auto text-base mb-4">
                <span class="dcg">Enter</span> Replay Level
            </button>
            <div class="flex gap-4 justify-center">
                <button id="play-again-btn" class="text-gray-500 hover:text-gray-700 font-medium text-sm">
                    <span class="dcg">Esc</span> Back to Levels
                </button>
            </div>
        </div>

    </div>

    <!-- ===== Configuration ===== -->
    <script>
        // Configuration
        const CONFIG = {
            LEVEL_GROUPS: {
                "Working in Degrees": [
                    { key: 'exact_deg_mixed', name: 'Exact Values', type: 'exact', unit: 'deg' },
                    { key: 'reference_angles', name: 'Reference Angles', type: 'reference_angles' },
                    { key: 'equiv_deg', name: 'Equivalent Ratios', type: 'equivalent', unit: 'deg' },
                    { key: 'quad_deg', name: 'Exact Values in all Quadrants', type: 'quadrant', unit: 'deg' },
                ],
                "Degree and Radian Conversion": [
                    { key: 'simplify_fractions', name: 'Simplify Fractions<br>over 180', type: 'simplify_fractions' },
                    { key: 'deg_to_rad', name: 'Degrees to Radians', type: 'conversion', direction: 'd2r' },
                    { key: 'rad_to_deg', name: 'Radians to Degrees', type: 'conversion', direction: 'r2d' },
                    { key: 'conv_mixed', name: 'Mixed Conversion', type: 'conversion', direction: 'mixed' },
                ],
                "Working in Radians": [
                    { key: 'exact_rad_mixed', name: 'Exact Values', type: 'exact', unit: 'rad' },
                    { key: 'reference_angles_rad', name: 'Reference Angles', type: 'reference_angles_rad' },
                    { key: 'equiv_rad', name: 'Equivalent Ratios', type: 'equivalent', unit: 'rad' },
                    { key: 'quad_rad', name: 'Exact Values in all Quadrants', type: 'quadrant', unit: 'rad' },
                ],
            },
            REQUIRED_STREAK: 10,
            FEEDBACK_DELAY_CORRECT: 400,
            FEEDBACK_DELAY_INCORRECT: 1500,
            POSITIVE_FEEDBACK: ["Correct!", "Excellent!", "Nice one!", "Perfect!", "You know it!", "Awesome!", "Great!"],
            RATING_THRESHOLDS: [
                { maxAvg: 2, name: "💖 Unit Circle Queen 💖", key: "true-mastery" },
                { maxAvg: 3, name: "⚡️ Trig Master ⚡️", key: "mastery" },
                { maxAvg: 4, name: "Expert", key: "expert" },
                { maxAvg: 5, name: "Pro", key: "pro" },
                { maxAvg: Infinity, name: "Apprentice", key: "apprentice" }
            ],
            STORAGE_PREFIX: 'tf_bestTime_v5_',
            CONFETTI: { CORRECT: 40, SUCCESS: 150 },
            LEVEL_DIFFICULTY_MULTIPLIERS: {
                'simplify_fractions': 1.0,   // Pure arithmetic
                'exact_deg_mixed': 1,      // Basic recall (degrees)
                'deg_to_rad': 2.0,           // Conversion formula
                'rad_to_deg': 2.0,           // Conversion formula
                'conv_mixed': 2.5,           // Mixed direction conversion
                'reference_angles': 1.0,     // Reference angles (degrees)
                'exact_rad_mixed': 1.5,      // Exact values in radians
                'reference_angles_rad': 1, // Reference angles (radians)
                'quad_deg': 4.0,             // All quadrants (degrees)
                'equiv_deg': 2,            // Equivalent ratios (degrees)
                'quad_rad': 5.0,             // All quadrants (radians)
                'equiv_rad': 2.5,            // Equivalent ratios (radians)
                'default': 1.0
            }
        };
    </script>

    <!-- Navigation buttons module -->
	<script src="navigationButtons.js"></script>

    <!-- ===== Local Libraries ===== -->
    <!-- jQuery (required by MathQuill) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="lib/math.js"></script>
    <script src="lib/mathquill/mathquill.js"></script>

    <!-- ===== Core Modules ===== -->
    <script src="trig-modules/trigGameState.js"></script>
    <script src="trig-modules/timer.js"></script>
    <script src="trig-modules/storageManager.js"></script>
    <script src="trig-modules/ratingUtils.js"></script>
    <script src="trig-modules/trigAnswerChecker.js"></script>
    <script src="trig-modules/confetti.js"></script>
    <script src="trig-modules/quadrantDiagramRenderer.js"></script>
    <script src="trig-modules/trigUI.js"></script>

    <!-- ===== Question Generator ===== -->
    <script src="trig-modules/questions/trigQuestionGenerator.js"></script>

    <!-- ===== Game Controller ===== -->
    <script src="trig-modules/trigGameController.js"></script>

    <!-- ===== Initialize Game ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new TrigGameController();
        });
    </script>

</body>
</html>
